[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project]
name = "parcel-damage-detection"
version = "0.1.0"
description = "Parcel damage detection with YOLO, ONNX and Dash dashboard"
requires-python = ">=3.10,<3.13"

dependencies = [
    "ultralytics==8.3.139",

    "numpy==2.0.2",
    "opencv-python==4.11.0.86",

    "torch==2.7.0",
    "torchvision==0.22.0",

    "pillow==11.2.1",
    "coremltools==8.3.0; platform_system == 'Darwin'",

    "onnx==1.17.0",
    "onnxruntime==1.19.2",

    "matplotlib==3.9.4",
    "fiftyone==1.5.2",

    "tqdm==4.67.1",
    "PyYAML==6.0.2",

    "dash==2.18.1",
    "dash-bootstrap-components==1.6.0",
    "scikit-learn==1.5.2",
    "plotly==5.24.1",
    "mlflow",
    "gunicorn"
]

[dependency-groups]
dev = []